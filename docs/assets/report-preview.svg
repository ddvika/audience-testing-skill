<text x="56" y="648" fill="#68665B" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">6 personas  →  8 visits  →  2 priorities  →  full dialogue appendix</text>
<text x="929" y="648" fill="#68665B" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">No live test. No API calls.</text>
