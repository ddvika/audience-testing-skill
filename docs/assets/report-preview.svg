<text x="691" y="553" fill="#272C26" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">Confirm what was selected.</text>
<text x="691" y="582" fill="#68665B" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Keep the result and next action visible.</text>
