<text x="929" y="291" fill="#B9BAAF" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">6 AI personas</text>
<line x1="88" y1="339" x2="1112" y2="339" stroke="#51564C"/>
<text x="88" y="422" fill="#FF8EAE" font-family="Arial,Helvetica,sans-serif" font-size="65" font-weight="400">6 / 8</text>
<text x="88" y="457" fill="#FFF4E6" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Visit goals reached</text>
<text x="88" y="483" fill="#B9BAAF" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">6 first visits + 2 continuations</text>
<text x="450" y="422" fill="#FFF4E6" font-family="Arial,Helvetica,sans-serif" font-size="65" font-weight="400">4 / 6</text>
<text x="450" y="457" fill="#FFF4E6" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Satisfied AI personas</text>
<text x="450" y="483" fill="#B9BAAF" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">Illustrative ratings, not human feedback</text>
<text x="864" y="422" fill="#FFF4E6" font-family="Arial,Helvetica,sans-serif" font-size="65" font-weight="400">2</text>
<text x="864" y="457" fill="#FFF4E6" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Release priorities</text>
<text x="864" y="483" fill="#B9BAAF" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">Linked to example events</text>
<text x="56" y="553" fill="#CF1747" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">01</text>
