<text x="283" y="77" fill="#CF1747" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="400">.</text>
<text x="58" y="112" fill="#68665B" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">AI product testing, with evidence you can inspect.</text>
<text x="906" y="46" fill="#68665B" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">REPORT ILLUSTRATION</text>
